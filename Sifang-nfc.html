<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>四方艺术湖区 · 招商合作</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Serif SC', 'PingFang SC', 'Microsoft YaHei', serif;
    background: #0a0a0f;
    color: #f5f0e8;
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 30%, rgba(30, 60, 80, 0.5) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 70%, rgba(60, 30, 50, 0.4) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(20, 40, 60, 0.3) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 420px;
    margin: 0 auto;
    padding: 50px 24px 40px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .deco-line {
    width: 40px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(200, 170, 120, 0.6), transparent);
    margin-bottom: 30px;
  }

  .logo-area {
    text-align: center;
    margin-bottom: 36px;
    animation: fadeIn 0.8s ease forwards;
  }

  .logo-icon {
    font-size: 44px;
    margin-bottom: 14px;
    display: block;
    opacity: 0.9;
  }

  .logo-title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 6px;
    color: #f5f0e8;
    margin-bottom: 6px;
  }

  .logo-sub {
    font-size: 12px;
    letter-spacing: 4px;
    color: rgba(200, 170, 120, 0.7);
    text-transform: uppercase;
  }

  .info-card {
    width: 100%;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(200, 170, 120, 0.12);
    border-radius: 12px;
    padding: 28px 24px;
    margin-bottom: 28px;
    animation: fadeUp 0.8s ease 0.2s forwards;
    opacity: 0;
  }

  .info-card h2 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    color: rgba(200, 170, 120, 0.9);
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(200, 170, 120, 0.1);
  }

  .info-item {
    display: flex;
    align-items: baseline;
    margin-bottom: 12px;
    font-size: 13.5px;
    line-height: 1.7;
    color: rgba(245, 240, 232, 0.75);
  }

  .info-item:last-child { margin-bottom: 0; }

  .info-icon {
    flex-shrink: 0;
    width: 20px;
    margin-right: 10px;
    text-align: center;
    font-size: 13px;
  }

  .btn-group {
    width: 100%;
    animation: fadeUp 0.8s ease 0.4s forwards;
    opacity: 0;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 17px 0;
    margin-bottom: 14px;
    border-radius: 50px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    text-decoration: none;
    letter-spacing: 2px;
    cursor: pointer;
    border: none;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .btn:active { transform: scale(0.97); }

  .btn-primary {
    background: linear-gradient(135deg, #c8956c 0%, #a06840 100%);
    color: #fff;
    box-shadow: 0 4px 20px rgba(180, 120, 60, 0.25);
  }

  .btn-primary::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -60%;
    width: 40%;
    height: 200%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
    transform: rotate(25deg);
    animation: shimmer 3s ease-in-out infinite;
  }

  .btn-secondary {
    background: rgba(255, 255, 255, 0.06);
    color: rgba(245, 240, 232, 0.8);
    border: 1px solid rgba(200, 170, 120, 0.2);
  }

  .btn-icon { margin-right: 8px; font-size: 16px; }

  .footer {
    margin-top: auto;
    padding-top: 36px;
    text-align: center;
    animation: fadeUp 0.8s ease 0.6s forwards;
    opacity: 0;
  }

  .footer-text {
    font-size: 11px;
    color: rgba(245, 240, 232, 0.25);
    letter-spacing: 1px;
    line-height: 1.8;
  }

  .footer-divider {
    width: 24px;
    height: 1px;
    background: rgba(200, 170, 120, 0.15);
    margin: 14px auto;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes shimmer {
    0%   { left: -60%; }
    50%  { left: 120%; }
    100% { left: 120%; }
  }

  .glow {
    position: fixed;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(200, 170, 120, 0.06) 0%, transparent 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: breathe 4s ease-in-out infinite;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
    50%      { opacity: 0.6; transform: translate(-50%, -50%) scale(1.15); }
  }
</style>
</head>
<body>

<div class="glow"></div>

<div class="container">

  <div class="deco-line"></div>

  <div class="logo-area">
    <span class="logo-icon">◆</span>
    <h1 class="logo-title">四方艺术湖区</h1>
    <p class="logo-sub">Pukou Culture &amp; Tourism</p>
  </div>

  <div class="info-card">
    <h2>招商合作</h2>
    <div class="info-item">
      <span class="info-icon">◈</span>
      <span>南京市浦口区重点文旅项目</span>
    </div>
    <div class="info-item">
      <span class="info-icon">◈</span>
      <span>集艺术展览、文创产业、休闲旅游于一体</span>
    </div>
    <div class="info-item">
      <span class="info-icon">◈</span>
      <span>现面向社会公开招商，诚邀合作</span>
    </div>
    <div class="info-item">
      <span class="info-icon">◈</span>
      <span>点击下方按钮查看详情与联系方式</span>
    </div>
  </div>

  <div class="btn-group">
    <a class="btn btn-primary"
       href="https://mp.weixin.qq.com/s/LehaqilCWJ3KS4c1JLIYYA">
      <span class="btn-icon">📖</span>
      查看招商详情
    </a>

    <a class="btn btn-secondary"
       href="https://mp.weixin.qq.com/s/LehaqilCWJ3KS4c1JLIYYA">
      <span class="btn-icon">💬</span>
      在微信中打开并关注
    </a>
  </div>

  <div class="footer">
    <div class="footer-divider"></div>
    <p class="footer-text">
      浦口文旅集团 · 四方艺术湖区<br>
      触碰 NFC 冰箱贴即可访问
    </p>
  </div>

</div>

</body>
</html>
