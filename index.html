<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>四方艺术湖区 · 招商合作</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
    background: #0b0b12;
    color: #f0ebe3;
  }

  .page {
    width: 100%;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 25% 20%, rgba(30, 55, 85, 0.45) 0%, transparent 55%),
      radial-gradient(ellipse at 75% 75%, rgba(55, 25, 45, 0.35) 0%, transparent 50%),
      #0b0b12;
  }

  /* 顶部开屏背景图区域 */
  .hero {
    position: relative;
    width: 100%;
    min-height: 62vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    overflow: hidden;
    background-image:
      linear-gradient(
        to bottom,
        rgba(11, 11, 18, 0.02) 0%,
        rgba(11, 11, 18, 0.18) 45%,
        rgba(11, 11, 18, 0.92) 100%
      ),
      url("contact-bg.jpg");
    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
  }

  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 50% 30%, rgba(255,255,255,0.04), transparent 45%),
      linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.2) 100%);
    pointer-events: none;
  }

  .hero-content {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    padding: 0 22px 34px;
    text-align: center;
    animation: fadeUp 0.8s ease forwards;
  }

  .tag {
    display: inline-block;
    padding: 7px 14px;
    margin-bottom: 14px;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 999px;
    background: rgba(0,0,0,0.28);
    color: rgba(255,255,255,0.9);
    font-size: 12px;
    letter-spacing: 2px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .hero h1 {
    font-size: 29px;
    font-weight: 800;
    letter-spacing: 4px;
    color: #fff;
    margin-bottom: 8px;
    text-shadow: 0 2px 16px rgba(0,0,0,0.45);
  }

  .hero p {
    font-size: 13px;
    line-height: 1.8;
    color: rgba(255,255,255,0.82);
    letter-spacing: 1px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.45);
  }

  .content {
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    padding: 22px 22px 36px;
  }

  .card {
    width: 100%;
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid rgba(190, 155, 100, 0.12);
    border-radius: 16px;
    padding: 22px 20px;
    margin-bottom: 22px;
    box-shadow: 0 16px 45px rgba(0,0,0,0.22);
    animation: fadeUp 0.8s ease 0.1s both;
  }

  .card h2 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    color: rgba(212, 172, 112, 0.95);
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(190, 155, 100, 0.1);
  }

  .row {
    display: flex;
    align-items: baseline;
    margin-bottom: 10px;
    font-size: 13.5px;
    line-height: 1.75;
    color: rgba(240, 235, 227, 0.76);
  }

  .row:last-child {
    margin-bottom: 0;
  }

  .dot {
    flex-shrink: 0;
    width: 18px;
    margin-right: 8px;
    text-align: center;
    font-size: 12px;
    color: rgba(212, 172, 112, 0.7);
  }

  .btns {
    width: 100%;
    animation: fadeUp 0.8s ease 0.2s both;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 54px;
    margin-bottom: 12px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    text-decoration: none;
    letter-spacing: 2px;
    cursor: pointer;
    border: none;
    transition: transform 0.2s ease, box-shadow 0.3s ease;
    position: relative;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  .btn:active {
    transform: scale(0.96);
  }

  .btn-go {
    background: linear-gradient(135deg, #c0875a 0%, #9a6035 100%);
    color: #fff;
    box-shadow: 0 8px 24px rgba(170, 110, 55, 0.25);
  }

  .btn-go::after {
    content: '';
    position: absolute;
    top: -60%;
    left: -65%;
    width: 45%;
    height: 220%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.14), transparent);
    transform: rotate(28deg);
    animation: shine 3.5s ease-in-out infinite;
  }

  .btn-sub {
    background: rgba(255, 255, 255, 0.055);
    color: rgba(240, 235, 227, 0.82);
    border: 1px solid rgba(190, 155, 100, 0.18);
    height: 50px;
    font-size: 14px;
  }

  .btn .ic {
    margin-right: 7px;
    font-size: 16px;
  }

  .contact {
    margin-top: 18px;
    padding: 18px 18px;
    border-radius: 14px;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.06);
    color: rgba(240,235,227,0.68);
    font-size: 13px;
    line-height: 1.9;
    animation: fadeUp 0.8s ease 0.3s both;
  }

  .contact p {
    margin-bottom: 4px;
  }

  .contact p:last-child {
    margin-bottom: 0;
  }

  .contact strong {
    color: rgba(212, 172, 112, 0.95);
    font-weight: 700;
  }

  .foot {
    margin-top: 28px;
    text-align: center;
    color: rgba(240, 235, 227, 0.28);
    font-size: 10.5px;
    letter-spacing: 1px;
    line-height: 1.9;
    animation: fadeUp 0.8s ease 0.4s both;
  }

  @keyframes fadeUp {
    from {
      opacity: 0;
      transform: translateY(18px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes shine {
    0%   { left: -65%; }
    45%  { left: 130%; }
    100% { left: 130%; }
  }

  /* 小屏手机适配 */
  @media (max-width: 380px) {
    .hero h1 {
      font-size: 25px;
      letter-spacing: 3px;
    }

    .hero p {
      font-size: 12px;
    }

    .content {
      padding-left: 18px;
      padding-right: 18px;
    }

    .card {
      padding: 18px 16px;
    }
  }

  @media (max-height: 680px) {
    .hero {
      min-height: 55vh;
    }

    .content {
      padding-top: 16px;
    }

    .btn {
      height: 50px;
    }
  }
</style>
</head>

<body>

<div class="page">

</div>

</body>
</html>
